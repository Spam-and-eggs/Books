<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sounds of the British Breakfast — Spam and Eggs</title>
<meta name="description" content="Press a breakfast item, enjoy the completely unnecessary sound design. From Spam and Eggs: A Very Serious Morning.">
<link rel="icon" href="assets/images/favicon.ico" sizes="any">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<section class="sounds-hero">
  <div class="wrap">
    <a href="index.html" class="back-link">&larr; Back to Spam and Eggs</a>
    <p class="eyebrow">Field Recordings</p>
    <h1>Sounds of the British Breakfast</h1>
    <p>Turn up the volume. Press a breakfast item and enjoy the completely unnecessary sound design.</p>
  </div>
</section>

<section>
  <div class="wrap">
    <div class="sound-grid">
      <button class="sound-btn" data-a="sounds/eggs-frying.wav"><span class="emoji">🍳</span>Eggs Frying<small>Sizzle. Crackle. Breakfast.</small></button>
      <button class="sound-btn" data-a="sounds/bacon-sizzling.wav"><span class="emoji">🥓</span>Bacon Sizzling<small>Serious frying business.</small></button>
      <button class="sound-btn" data-a="sounds/beans-simmering.wav"><span class="emoji">🥫</span>Beans Simmering<small>Bubble bubble, brown-sauce trouble.</small></button>
      <button class="sound-btn" data-a="sounds/toast-pop.wav"><span class="emoji">🍞</span>Toast Popping<small>POP!</small></button>
      <button class="sound-btn" data-a="sounds/kettle-boiling.wav"><span class="emoji">🫖</span>Kettle Boiling<small>Tea is imminent.</small></button>
      <button class="sound-btn" data-a="sounds/toast-buttered.wav"><span class="emoji">🧈</span>Butter on Toast<small>The essential scraping sound.</small></button>
      <button class="sound-btn" data-a="sounds/tea-pouring.wav"><span class="emoji">☕</span>Tea Pouring<small>Milk and manners optional.</small></button>
      <button class="sound-btn" data-a="sounds/plate-and-cutlery.wav"><span class="emoji">🍽️</span>Plate &amp; Cutlery<small>Breakfast has been served.</small></button>
    </div>
  </div>
</section>

<footer>
  <div class="wrap">
    <p class="disclosure">Original synthesized sample effects. No third-party audio files are included.</p>
    <p class="copyright">© 2026 Arge Barn. All rights reserved.</p>
  </div>
</footer>

<script>
  let current = null;
  document.querySelectorAll('.sound-btn').forEach(function (b) {
    b.addEventListener('click', function () {
      if (current) current.pause();
      current = new Audio(b.dataset.a);
      current.play();
    });
  });
</script>

</body>
</html>
